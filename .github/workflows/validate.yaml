name: Validate, Scan and Deploy Kubernetes Manifests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-scan-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          for file in k8s-manifests/*.yaml; do
            echo "Validating $file"
            kubectl apply --dry-run=client -f "$file"
          done

      - name: Install Trivy
        run: |
          mkdir -p $HOME/bin
          if ! command -v trivy &> /dev/null && [ ! -f "$HOME/bin/trivy" ]; then
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b $HOME/bin
          fi
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Scan nginx image for vulnerabilities
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 0 --timeout 15m --skip-java-db-update --scanners vuln nginx:latest

      - name: Deploy to Kubernetes
        if: github.event_name == 'push'
        run: |
          kubectl apply -f k8s-manifests/nginx-configmap.yaml
          kubectl apply -f k8s-manifests/nginx-deployment.yaml
          kubectl apply -f k8s-manifests/nginx-service.yaml
          kubectl apply -f k8s-manifests/nginx-ingress.yaml

      - name: Verify deployment
        if: github.event_name == 'push'
        run: |
          kubectl rollout status deployment/nginx-test -n dev --timeout=60s
          kubectl get pods -n dev
